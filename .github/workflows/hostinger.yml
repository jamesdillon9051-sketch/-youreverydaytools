name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: https://youreverydaytools.weeklydelight.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Test and build the static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ftp_configured: ${{ steps.deployment-settings.outputs.ftp_configured }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify calculations and encoding
        run: npm test

      - name: Verify shared-hosting PHP gateway
        run: |
          php -l public/api/social-lib.php
          php -l public/api/social.php
          php -l public/api/social-download.php
          php tests/social-api.test.php

      - name: Build static website and check TypeScript
        run: npm run build

      - name: Preserve deployment files
        uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Check optional FTP deployment settings
        id: deployment-settings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_DIRECTORY: ${{ secrets.HOSTINGER_FTP_DIRECTORY }}
        run: |
          configured=true
          for key in HOSTINGER_FTP_SERVER HOSTINGER_FTP_USERNAME HOSTINGER_FTP_PASSWORD HOSTINGER_FTP_DIRECTORY; do
            if [ -z "${!key}" ]; then configured=false; fi
          done
          printf 'ftp_configured=%s\n' "$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" = false ]; then
            echo 'FTP deployment is not configured. The compiled hostinger branch is still published for Hostinger hPanel Git.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish_hostinger_git:
    name: Update compiled website branch for Hostinger Git
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository with branch publishing access
        uses: actions/checkout@v4

      - name: Download tested website outside the source tree
        uses: actions/download-artifact@v4
        with:
          name: static-website
          path: ${{ runner.temp }}/static-website

      - name: Publish static files at the branch root
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -f "$RUNNER_TEMP/static-website/index.html"
          test -f "$RUNNER_TEMP/static-website/.htaccess"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git ls-remote --heads origin hostinger)" ]; then
            git fetch --no-tags origin hostinger
            git checkout --force -B hostinger FETCH_HEAD
          else
            git checkout -b hostinger
          fi
          git merge --strategy=ours --no-edit --allow-unrelated-histories "$SOURCE_SHA"
          git rm -rf --ignore-unmatch -- .
          cp -a "$RUNNER_TEMP/static-website/." .
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Build website from ${SOURCE_SHA}"
          fi
          git push origin HEAD:refs/heads/hostinger
          echo 'Hostinger hPanel Git: use branch hostinger and deploy into this subdomain’s document root. Edit source on main.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish static files to Hostinger
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.ftp_configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://youreverydaytools.weeklydelight.com
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download tested website
        uses: actions/download-artifact@v4
        with:
          name: static-website
          path: out/

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload through verified TLS
        run: node scripts/deploy-hostinger.mjs
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_DIRECTORY: ${{ secrets.HOSTINGER_FTP_DIRECTORY }}
          HOSTINGER_FTP_PORT: ${{ vars.HOSTINGER_FTP_PORT || '21' }}

      - name: Confirm public website is reachable
        run: |
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --output /dev/null "$NEXT_PUBLIC_SITE_URL/"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --output /dev/null "$NEXT_PUBLIC_SITE_URL/sitemap.xml"
