name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: https://youreverydaytools.weeklydelight.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Test and build the static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify calculations and encoding
        run: npm test

      - name: Build static website and check TypeScript
        run: npm run build

      - name: Preserve deployment files
        uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish static files to Hostinger
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://youreverydaytools.weeklydelight.com
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download tested website
        uses: actions/download-artifact@v4
        with:
          name: static-website
          path: out/

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload through verified TLS
        run: node scripts/deploy-hostinger.mjs
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_DIRECTORY: ${{ secrets.HOSTINGER_FTP_DIRECTORY }}
          HOSTINGER_FTP_PORT: ${{ vars.HOSTINGER_FTP_PORT || '21' }}

      - name: Confirm public website is reachable
        run: |
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --output /dev/null "$NEXT_PUBLIC_SITE_URL/"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --output /dev/null "$NEXT_PUBLIC_SITE_URL/sitemap.xml"
